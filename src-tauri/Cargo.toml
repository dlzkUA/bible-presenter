[package]
name = "bible-presenter"
version = "3.0.1"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mime_guess = "2.0.5"
once_cell = "1.21.4"
parking_lot = "0.12.5"
prost-reflect = { version = "0.16.5", features = ["serde"] }
qrcode = "0.14.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
rusty-leveldb = "4.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = "0.1.19"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
unicode-normalization = "0.1.25"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
prost = "0.14"
protox = "0.9.1"
tauri-build = { version = "2", features = [] }

[dev-dependencies]
prost = "0.14"

[profile.release]
strip = true
