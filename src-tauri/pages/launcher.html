<!doctype html>
<html><head><meta charset="utf-8"><title>Bible Presenter — Live</title>
<style>html,body{margin:0;background:transparent}</style></head>
<body><script>
// Saved from Bible Presenter and opened in vMix or OBS as a file, so it loads
// even while the program is not running yet. It shows nothing (it sits on the
// broadcast), checks every two seconds whether Bible Presenter answers on one
// of its addresses, and then opens the live page there, keeping anything after
// the file name, such as "?transparent=1".
(function () {
  var targets = __TARGETS__;
  var tail = (location.search || "") + (location.hash || "");
  function probe(base) {
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, 1500);
    return fetch(base + "link.js?probe=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function () { clearTimeout(t); return true; }, function () { clearTimeout(t); return false; });
  }
  function tick() {
    Promise.all(targets.map(probe)).then(function (ok) {
      for (var i = 0; i < targets.length; i++) {
        if (ok[i]) { location.replace(targets[i] + tail); return; }
      }
      setTimeout(tick, 2000);
    });
  }
  tick();
})();
</script></body></html>
