<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#a6adc8"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cdd6f4"/>
      <stop offset="100%" stop-color="#bac2de"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Open book -->
  <g>
    <path d="M256 168 C 200 140, 120 140, 96 156 L 96 356 C 120 340, 200 340, 256 368 Z" fill="url(#pageL)"/>
    <path d="M256 168 C 312 140, 392 140, 416 156 L 416 356 C 392 340, 312 340, 256 368 Z" fill="url(#pageR)"/>
    <path d="M256 168 L 256 368" stroke="#7f849c" stroke-width="3"/>

    <!-- text lines, left page -->
    <line x1="124" y1="196" x2="226" y2="208" stroke="#7287fd" stroke-width="7" stroke-linecap="round"/>
    <line x1="124" y1="222" x2="226" y2="232" stroke="#9399b2" stroke-width="6" stroke-linecap="round"/>
    <line x1="124" y1="248" x2="216" y2="256" stroke="#9399b2" stroke-width="6" stroke-linecap="round"/>
    <line x1="124" y1="274" x2="226" y2="280" stroke="#9399b2" stroke-width="6" stroke-linecap="round"/>

    <!-- text lines, right page -->
    <line x1="286" y1="208" x2="388" y2="196" stroke="#9399b2" stroke-width="6" stroke-linecap="round"/>
    <line x1="296" y1="232" x2="388" y2="222" stroke="#9399b2" stroke-width="6" stroke-linecap="round"/>
    <line x1="296" y1="256" x2="388" y2="248" stroke="#9399b2" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Present/play badge, bottom-right, overlapping the book -->
  <circle cx="372" cy="372" r="86" fill="#1e1e2e" stroke="#313244" stroke-width="4"/>
  <circle cx="372" cy="372" r="76" fill="#89b4fa"/>
  <path d="M348 336 L 408 372 L 348 408 Z" fill="#11111b"/>
</svg>
